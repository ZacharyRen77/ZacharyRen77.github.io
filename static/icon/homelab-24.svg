<rect x="39" y="56" width="51" height="16" rx="5" fill="#111B50" filter="url(#shadow)"/>
<rect x="39" y="76" width="51" height="16" rx="5" fill="#111B50" filter="url(#shadow)"/>
<rect x="39" y="96" width="51" height="12" rx="5" fill="#111B50"/>
<rect x="44" y="61" width="24" height="4" rx="2" fill="#314E9D"/>
<rect x="44" y="81" width="24" height="4" rx="2" fill="#314E9D"/>
