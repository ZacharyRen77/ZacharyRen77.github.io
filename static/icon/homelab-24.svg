<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 128 128" role="img" aria-label="homelab">

<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#72C8FF"/><stop offset=".52" stop-color="#3478F6"/><stop offset="1" stop-color="#4930C9"/>
  </linearGradient>
  <linearGradient id="blue2" x1="0" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#55D8F5"/><stop offset="1" stop-color="#2751D8"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#B58BFF"/><stop offset=".55" stop-color="#7148E8"/><stop offset="1" stop-color="#3B24A6"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFD18A"/><stop offset=".55" stop-color="#FF944C"/><stop offset="1" stop-color="#E65A83"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF0E5"/><stop offset=".55" stop-color="#B9D8FF"/><stop offset="1" stop-color="#7561E8"/>
  </linearGradient>
  <linearGradient id="darkglass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#263C91"/><stop offset="1" stop-color="#171B59"/>
  </linearGradient>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
    <feOffset dy="3" result="off"/>
    <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>


