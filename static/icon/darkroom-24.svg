<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 128 128" role="img" aria-label="darkroom">

<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#72C8FF"/><stop offset=".52" stop-color="#3478F6"/><stop offset="1" stop-color="#4930C9"/>
  </linearGradient>
  <linearGradient id="blue2" x1="0" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#55D8F5"/><stop offset="1" stop-color="#2751D8"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#B58BFF"/><stop offset=".55" stop-color="#7148E8"/><stop offset="1" stop-color="#3B24A6"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFD18A"/><stop offset=".55" stop-color="#FF944C"/><stop offset="1" stop-color="#E65A83"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF0E5"/><stop offset=".55" stop-color="#B9D8FF"/><stop offset="1" stop-color="#7561E8"/>
  </linearGradient>
  <linearGradient id="darkglass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#263C91"/><stop offset="1" stop-color="#171B59"/>
  </linearGradient>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
    <feOffset dy="3" result="off"/>
    <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>


<!-- luminous iris: alluring, nocturnal, not literal camera -->
<circle cx="64" cy="64" r="49" fill="#11163D" stroke="url(#violet)" stroke-width="2.5" filter="url(#softGlow)"/>
<circle cx="64" cy="64" r="41" fill="#0B102B" stroke="#6B4ACD" stroke-width="2"/>
<g filter="url(#shadow)">
  <path d="M64 24q19 0 27 16L70 58 51 43q2-19 13-19Z" fill="url(#violet)"/>
  <path d="M104 64q0 19-16 27L70 70l15-19q19 2 19 13Z" fill="#4934A9"/>
  <path d="M64 104q-19 0-27-16l21-18 19 15q-2 19-13 19Z" fill="#33267F"/>
  <path d="M24 64q0-19 16-27l18 21-15 19q-19-2-19-13Z" fill="#25276F"/>
  <path d="M37 37q15-12 28-11l-1 28-19 10Z" fill="#8D5CE8" opacity=".75"/>
  <path d="M91 91q-15 12-28 11l1-28 19-10Z" fill="#6E42C7" opacity=".8"/>
</g>
<circle cx="64" cy="64" r="13" fill="#080D25" stroke="#8D67F0" stroke-width="2"/>
<path d="m100 18 5 12 12 5-12 5-5 12-5-12-12-5 12-5Z" fill="url(#orange)" filter="url(#softGlow)"/>
<path d="M28 89q12 15 28 17" fill="none" stroke="#F17DBD" stroke-width="2" opacity=".5"/>

</svg>
